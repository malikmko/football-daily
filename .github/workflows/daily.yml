name: Football Daily Drop

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Bring back the last refreshes (history.json from gh-pages)
        run: |
          if git fetch --depth=1 origin gh-pages && git show FETCH_HEAD:history.json > history.json; then
            echo "history.json restored"
          else
            rm -f history.json; echo "no history yet"
          fi

      - name: Run football research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: ".github,.gitignore,fetch_news.py,requirements.txt,articles.json,trends.json,*.md"
